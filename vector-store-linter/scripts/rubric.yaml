# Vector Store Linter: Default Rubric
#
# Tiers:
#   tier_1_config:    static checks against store configuration. No data read required.
#   tier_2_content:   checks against vector content and metadata. Sample or full read.
#   tier_3_retrieval: checks against retrieval performance. Requires ground truth.
#
# Each criterion:
#   id:          stable identifier used in output
#   name:        human-readable name
#   tier:        tier_1_config | tier_2_content | tier_3_retrieval
#   weight:      relative weight inside its tier (sum to 100 within tier)
#   severity:    info | warn | fail | critical (drives CI gates)
#   description: shown in output and used for fix suggestions
#   threshold:   parameters for the check (criterion-specific)
#
# CI gates fail the build on any criterion of severity >= specified level
# (default: critical).

tier_weights:
  tier_1_config: 25
  tier_2_content: 30
  tier_3_retrieval: 45

# When ground truth is unavailable, the skill rebalances to:
#   tier_1_config: 40
#   tier_2_content: 60
#   tier_3_retrieval: skipped

criteria:

  # ------------------------------------------------------------------
  # Tier 1: Configuration and shape
  # ------------------------------------------------------------------

  - id: c_dimension_consistency
    name: Dimension consistency
    tier: tier_1_config
    weight: 15
    severity: critical
    description: All vectors in the store have the same dimension. Mixed dimensions indicate corruption or mixed embedding models.
    threshold:
      allow_mismatch: false

  - id: c_distance_metric_appropriate
    name: Distance metric appropriate for embeddings
    tier: tier_1_config
    weight: 12
    severity: warn
    description: Distance metric matches embedding normalization. Cosine for normalized embeddings, L2 for unnormalized, dot product when explicitly justified.
    threshold:
      sample_size_for_normalization_check: 1000
      normalization_tolerance: 0.05

  - id: c_index_type_for_scale
    name: Index type matches scale
    tier: tier_1_config
    weight: 10
    severity: warn
    description: Index type is appropriate for the vector count. Flat at >100k vectors is too slow; HNSW with defaults at <1k is overkill.
    threshold:
      flat_max_vectors: 100000
      hnsw_min_vectors: 1000

  - id: c_hnsw_parameters_tuned
    name: HNSW parameters in sensible range
    tier: tier_1_config
    weight: 10
    severity: warn
    description: HNSW parameters (M, ef_construction, ef_search) are not at library defaults. Defaults rarely match production needs.
    threshold:
      ef_min: 50
      m_min: 16

  - id: c_freshness_configured
    name: Freshness and refresh configured
    tier: tier_1_config
    weight: 10
    severity: warn
    description: Store has a documented refresh cadence and freshness expectation. Without this, the store drifts from its source of truth.
    threshold: {}

  - id: c_replication_for_scale
    name: Replication and sharding appropriate
    tier: tier_1_config
    weight: 8
    severity: info
    description: Single-shard single-replica configuration is unsuitable for production scale.
    threshold:
      production_vector_threshold: 100000

  - id: c_metadata_schema_declared
    name: Metadata schema declared
    tier: tier_1_config
    weight: 15
    severity: warn
    description: Store has a documented metadata schema. Without it, filter-based retrieval cannot be used.
    threshold: {}

  - id: c_embedding_model_recorded
    name: Embedding model recorded in metadata
    tier: tier_1_config
    weight: 10
    severity: warn
    description: Vectors carry a model identifier in metadata. Mixed-model embeddings are not directly comparable and silent model drift produces silent quality drift.
    threshold:
      min_coverage: 0.95

  - id: c_namespace_or_tenant_isolation
    name: Namespace or tenant isolation
    tier: tier_1_config
    weight: 10
    severity: info
    description: For multi-tenant stores, namespace or tenant isolation is configured. Single namespace for multiple tenants risks cross-tenant retrieval.
    threshold: {}

  # ------------------------------------------------------------------
  # Tier 2: Content quality
  # ------------------------------------------------------------------

  - id: c_no_exact_duplicates
    name: No exact duplicate vectors
    tier: tier_2_content
    weight: 15
    severity: warn
    description: Exact duplicate vectors (same embedding, same metadata) inflate retrieval precision and waste storage.
    threshold:
      max_duplicate_rate: 0.01

  - id: c_no_near_duplicates
    name: Low near-duplicate rate
    tier: tier_2_content
    weight: 15
    severity: warn
    description: Near-duplicate vectors (cosine similarity above threshold) indicate chunking or deduplication problems.
    threshold:
      similarity_threshold: 0.98
      max_near_duplicate_rate: 0.05

  - id: c_chunk_size_distribution
    name: Chunk size distribution reasonable
    tier: tier_2_content
    weight: 12
    severity: warn
    description: Chunk sizes are reasonably consistent. Very small chunks (under 50 tokens) produce noise; very large chunks (over 2000 tokens) dilute retrieval.
    threshold:
      min_acceptable_tokens: 50
      max_acceptable_tokens: 2000
      max_outlier_rate: 0.10

  - id: c_no_empty_content
    name: No empty or near-empty content
    tier: tier_2_content
    weight: 10
    severity: fail
    description: Chunks with mostly whitespace, mostly headers, or mostly boilerplate retrieve on lexical accident and pollute results.
    threshold:
      min_non_whitespace_chars: 100

  - id: c_metadata_completeness
    name: Metadata completeness
    tier: tier_2_content
    weight: 13
    severity: warn
    description: Expected metadata fields are populated. Sparse metadata limits filter-based retrieval.
    threshold:
      required_fields: []  # populated from store config
      min_field_coverage: 0.90

  - id: c_embedding_distribution
    name: Embeddings well-distributed in space
    tier: tier_2_content
    weight: 10
    severity: info
    description: Embeddings are not heavily clustered into a few hot regions. Heavy clustering indicates content imbalance that will skew retrieval.
    threshold:
      max_cluster_concentration: 0.30  # no single cluster contains >30% of vectors

  - id: c_no_orphan_references
    name: No orphan source-document references
    tier: tier_2_content
    weight: 10
    severity: fail
    description: Vectors referencing source documents that no longer exist, or whose source paths are dead.
    threshold:
      check_source_existence: true

  - id: c_embedding_model_homogeneous
    name: All embeddings from same model
    tier: tier_2_content
    weight: 15
    severity: critical
    description: All vectors produced by the same embedding model. Mixed-model embeddings produce systematically broken retrieval that is invisible at the configuration layer.
    threshold:
      allow_multiple_models: false

  # ------------------------------------------------------------------
  # Tier 3: Retrieval quality (requires ground truth)
  # ------------------------------------------------------------------

  - id: c_recall_at_5
    name: Recall@5
    tier: tier_3_retrieval
    weight: 15
    severity: fail
    description: Fraction of relevant documents in top 5 results, averaged over ground-truth queries.
    threshold:
      min: 0.70

  - id: c_recall_at_10
    name: Recall@10
    tier: tier_3_retrieval
    weight: 18
    severity: fail
    description: Fraction of relevant documents in top 10 results, averaged over ground-truth queries.
    threshold:
      min: 0.80

  - id: c_precision_at_5
    name: Precision@5
    tier: tier_3_retrieval
    weight: 12
    severity: warn
    description: Fraction of top 5 results that are relevant. Low precision means the downstream LLM has to filter noise.
    threshold:
      min: 0.50

  - id: c_ndcg_at_10
    name: NDCG@10
    tier: tier_3_retrieval
    weight: 12
    severity: warn
    description: Normalized discounted cumulative gain at 10. Rewards relevant results being higher in the ranking.
    threshold:
      min: 0.70

  - id: c_mrr
    name: Mean reciprocal rank
    tier: tier_3_retrieval
    weight: 10
    severity: warn
    description: Average of 1/rank of the first relevant result. Useful when "find one good answer" is the goal.
    threshold:
      min: 0.60

  - id: c_hit_rate_at_10
    name: Hit rate@10
    tier: tier_3_retrieval
    weight: 13
    severity: fail
    description: Fraction of queries with at least one relevant result in top 10. The "did this query work at all" metric.
    threshold:
      min: 0.90

  - id: c_query_failure_concentration
    name: Failures not concentrated in one type
    tier: tier_3_retrieval
    weight: 10
    severity: warn
    description: Failed queries are spread across query types. Concentrated failures (e.g., all metric-definition queries fail) indicate a systematic problem.
    threshold:
      max_failure_concentration_per_type: 0.40

  - id: c_no_universal_results
    name: No vector retrieved for almost everything
    tier: tier_3_retrieval
    weight: 10
    severity: warn
    description: No single vector is retrieved in the top results for an unusually large fraction of queries. Universal results indicate boilerplate or template content polluting the index.
    threshold:
      max_appearance_rate: 0.15

# ------------------------------------------------------------------
# Failure-mode classification (used in Tier 3 reporting)
# ------------------------------------------------------------------

failure_modes:

  - id: vocabulary_mismatch
    name: Vocabulary mismatch
    description: Query uses different vocabulary than the relevant document (e.g., clinical vs. lay terminology). Detected by lexical overlap analysis.

  - id: semantic_distance
    name: Excessive semantic distance
    description: Query and relevant document are semantically related but the embedding model places them far apart. Detected by similarity score distribution.

  - id: missing_metadata_filter
    name: Missing metadata filter
    description: Relevant document exists in the store but is being out-ranked by less-relevant documents that share more lexical surface with the query. Often indicates a missing metadata filter.

  - id: chunking_artifact
    name: Chunking artifact
    description: The relevant information was split across chunks, and the chunk that retrieved is not the one that contains the answer.

  - id: boilerplate_pollution
    name: Boilerplate pollution
    description: One chunk retrieves against many unrelated queries. Usually a header, footer, or template that was indexed.

  - id: stale_content
    name: Stale content
    description: Retrieved chunk references information that has been superseded or removed.

  - id: model_drift
    name: Embedding model inconsistency
    description: Query and document were embedded with different models or model versions. Detected by metadata when available.
